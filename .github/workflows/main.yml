name: Build & Release Burp Extension

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi bạn push tag dạng v1.0.0, v1.0.1...
  workflow_dispatch: # Cho phép bấm build thủ công từ web UI

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền cho GitHub Action tạo Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper Jar
      run: gradle wrapper

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle (shadowJar)
      run: ./gradlew shadowJar --no-daemon

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/*.jar
        name: TLS Bypass Extension ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
