name: Build Burp Extension

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút Build thủ công từ web UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Generate Gradle Wrapper Jar
      run: gradle wrapper
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Build with Gradle (shadowJar)
      run: ./gradlew shadowJar --no-daemon
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tls-bypass-burp-extension
        path: build/libs/*.jar
