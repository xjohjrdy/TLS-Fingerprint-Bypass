plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

group = 'com.bypasstls.burp'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// `options.release` is required in addition to the compatibility settings above.
// sourceCompatibility/targetCompatibility only pin the bytecode version and the
// language level - they do NOT restrict which JDK APIs may be referenced. Without
// this, a call to a Java 17-only API (e.g. java.util.HexFormat) compiles cleanly
// and only fails at runtime on the older JRE that ships with older Burp versions.
tasks.withType(JavaCompile) {
    options.release = 11
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Burp Suite legacy Extender API - provided by Burp at runtime, never bundled
    compileOnly 'net.portswigger.burp.extender:burp-extender-api:2.3'

    // OkHttp for HTTP communication with Python sidecar
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON processing
    implementation 'com.google.code.gson:gson:2.10.1'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'TLS Fingerprint Bypass',
            'Implementation-Version': project.version,
            'Extension-Name': 'TLS Fingerprint Bypass'
        )
    }
}

shadowJar {
    archiveBaseName.set('tls-bypass-burp')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())

    // Relocate dependencies to avoid conflicts with Burp's own classpath
    relocate 'okhttp3', 'com.bypasstls.shaded.okhttp3'
    relocate 'okio', 'com.bypasstls.shaded.okio'
    relocate 'com.google.gson', 'com.bypasstls.shaded.gson'

    manifest {
        attributes(
            'Implementation-Title': 'TLS Fingerprint Bypass',
            'Implementation-Version': project.version,
            'Extension-Name': 'TLS Fingerprint Bypass'
        )
    }
}

// Bundle the Python worker into the JAR (ResourceExtractor unpacks it at runtime)
sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'python']
            include '**/*'
        }
    }
}

processResources {
    from('python') {
        into 'python'
    }
}

build.dependsOn shadowJar
